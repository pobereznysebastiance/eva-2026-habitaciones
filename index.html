<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador de Habitaciones - EVA 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0b10;
            --bg-card: #121420;
            --accent-cyan: #00f2fe;
            --accent-pink: #ff0080;
            --accent-purple: #7928ca;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-card: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 20px;
            background-image: radial-gradient(circle at 10% 10%, rgba(121, 40, 202, 0.15) 0%, transparent 40%);
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-card);
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.8rem;
            background: linear-gradient(135deg, #fff, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-card);
            color: var(--text-main);
        }

        .btn-outline:hover { background: rgba(255, 255, 255, 0.15); }

        .layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; }
        }

        /* Panel Lateral (Alumnos Sin Asignar / Buscador) */
        .sidebar {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 12px;
            padding: 18px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .sidebar h2 {
            font-size: 1.1rem;
            font-family: 'Space Grotesk', sans-serif;
            margin-bottom: 12px;
            color: var(--accent-cyan);
            display: flex;
            justify-content: space-between;
        }

        .search-box {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-card);
            border-radius: 6px;
            color: #fff;
            font-size: 0.85rem;
            margin-bottom: 12px;
            outline: none;
        }

        .unassigned-list {
            min-height: 120px;
            max-height: 60vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 6px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            border: 1px dashed var(--border-card);
        }

        /* Tarjetas de Alumnos */
        .student-item {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: grab;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .student-item:active { cursor: grabbing; opacity: 0.6; }

        .btn-move-mobile {
            background: var(--accent-cyan);
            color: #000;
            border: none;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
        }

        /* Grid de Habitaciones */
        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .room-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: border-color 0.2s;
        }

        .room-card.drag-over {
            border-color: var(--accent-cyan);
            background: rgba(0, 242, 254, 0.05);
        }

        .room-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 8px;
        }

        .room-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            color: #fff;
        }

        .room-capacity {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
        }

        .cap-ok { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); }
        .cap-full { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); }

        .room-slots {
            min-height: 80px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>🏨 Gestor de Habitaciones O2</h1>
            <p style="color: var(--text-muted); font-size: 0.85rem;">Panel Exclusivo de Coordinación Académica</p>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-outline" onclick="resetToInitial()">🔄 Restaurar Inicial</button>
            <button class="btn" onclick="copyReport()">📋 Copiar Resumen</button>
        </div>
    </header>

    <div class="layout">
        <!-- Panel Lateral -->
        <div class="sidebar">
            <h2>
                <span>Sin Asignar / Libres</span>
                <span id="unassignedCount" style="color: var(--text-muted); font-size: 0.9rem;">0</span>
            </h2>
            <input type="text" id="searchInput" class="search-box" placeholder="Buscar alumno..." onkeyup="filterStudents()">
            
            <div id="unassignedList" class="unassigned-list" ondragover="allowDrop(event)" ondrop="drop(event, 'unassigned')">
                <!-- Alumnos sueltos aparecerán aquí -->
            </div>
        </div>

        <!-- Tablero de Habitaciones -->
        <div class="rooms-grid" id="roomsContainer">
            <!-- Habitaciones generadas dinámicamente -->
        </div>
    </div>

    <script>
        // Distribución original basada en el PDF[cite: 3]
        const initialDistribution = [
            { id: 1, cap: 2, students: ["Cochia Lucia", "AQUINO, Damián Exequiel"] },
            { id: 2, cap: 2, students: ["Couceiro Carlos Adolfo", "Couceiro Manuel"] },
            { id: 3, cap: 2, students: ["Mariasch, David", "Gómez Codutti Lucas"] },
            { id: 4, cap: 2, students: ["Gualtieri Fiorella Agostina", "Giuliano Tubiana"] },
            { id: 5, cap: 2, students: ["Gallardo Lucas Gabriel", "Parra Esteban"] },
            { id: 6, cap: 2, students: ["Juan Diego Gomez", "Benjamin Rolón"] },
            { id: 7, cap: 2, students: ["Rigoni Sappa Oriana Aylen", "Silvero Zacarías Maximiliano Hernán"] },
            { id: 8, cap: 2, students: ["Mateo Pelizardi", "Bárbara Andrea Flores Leliur"] },
            { id: 9, cap: 2, students: ["Radovancic Mijail lerko", "Montiel FogarThiago Nahuel"] },
            { id: 10, cap: 2, students: ["Maccarini Renzo", "Lopez Hardy Carlos"] },
            { id: 11, cap: 2, students: ["Rossi Aaron", "Alegre Lionel Nicolas"] },
            { id: 12, cap: 3, students: ["Pérez Velazco, Ariadna Carolina", "Zabala Meza Eliana", "Mia Nazaret Reijers"] },
            { id: 13, cap: 3, students: ["Sosa Fernández Lucía Magalí", "Becerra María Paula", "Bruno Sosa Maia Aylen"] },
            { id: 14, cap: 3, students: ["Sanchez Ojeda Matías Rogelio", "Nessier Tobias", "VERON ESCOBAR CARLOS DE JESUS"] },
            { id: 15, cap: 3, students: ["Vicedo Catalina", "Botello Capará Abril Maria", "Romero Delfina"] },
            { id: 16, cap: 3, students: ["Martinez Quiñones María de los Angeles", "Alvarenga Karen", "Esquivel maria jimena"] },
            { id: 17, cap: 4, students: ["Acevedo Jose Julian", "Clemente Rolon Joaquin Daniel", "Tomaszuk Matías Alejandro", "PRIETO FERNANDEZ, ENZO GABRIEL"] },
            { id: 18, cap: 4, students: ["Claudio Ezequiel Martinez Borda", "Livia Acosta José Martín", "Silva Darío", "Godoy Hector Santiago"] },
            { id: 19, cap: 4, students: ["Díaz Moroni Melanie Nain", "Barrios Servín Gimena Paola", "Martins Delfina", "Vallone Wolfel Agostina"] },
            { id: 20, cap: 4, students: ["Gimenez Guadalupe", "Margaria Gimena", "Martina Natali Vega", "Margaria Branz María Pilar"] },
            { id: 21, cap: 4, students: ["De Greef Juan Martín", "Poberezny Sebastián", "Alvarez José", "Di Rado Franco"] }
        ];

        let roomsData = JSON.parse(localStorage.getItem("eva_rooms_2026")) || JSON.parse(JSON.stringify(initialDistribution));
        let unassignedData = JSON.parse(localStorage.getItem("eva_unassigned_2026")) || [];

        function saveData() {
            localStorage.setItem("eva_rooms_2026", JSON.stringify(roomsData));
            localStorage.setItem("eva_unassigned_2026", JSON.stringify(unassignedData));
        }

        function renderApp() {
            // Render Unassigned
            const unassignedList = document.getElementById("unassignedList");
            unassignedList.innerHTML = "";
            document.getElementById("unassignedCount").innerText = unassignedData.length;

            unassignedData.forEach(student => {
                unassignedList.appendChild(createStudentNode(student, 'unassigned'));
            });

            // Render Rooms
            const roomsContainer = document.getElementById("roomsContainer");
            roomsContainer.innerHTML = "";

            roomsData.forEach(room => {
                const roomCard = document.createElement("div");
                roomCard.className = "room-card";
                roomCard.ondragover = allowDrop;
                roomCard.ondragleave = handleDragLeave;
                roomCard.ondrop = (e) => drop(e, room.id);

                const isFull = room.students.length > room.cap;
                const capBadgeClass = isFull ? 'cap-full' : 'cap-ok';

                roomCard.innerHTML = `
                    <div class="room-header">
                        <span class="room-title">Habitación #${room.id}</span>
                        <span class="room-capacity ${capBadgeClass}">${room.students.length} / ${room.cap} Cap.</span>
                    </div>
                    <div class="room-slots" id="room-slots-${room.id}"></div>
                `;

                const slots = roomCard.querySelector(".room-slots");
                room.students.forEach(student => {
                    slots.appendChild(createStudentNode(student, room.id));
                });

                roomsContainer.appendChild(roomCard);
            });

            saveData();
        }

        function createStudentNode(name, sourceLocation) {
            const div = document.createElement("div");
            div.className = "student-item";
            div.draggable = true;
            div.ondragstart = (e) => drag(e, name, sourceLocation);

            div.innerHTML = `
                <span>${name}</span>
                <button class="btn-move-mobile" onclick="moveStudentPrompt('${name}', '${sourceLocation}')">Mover</button>
            `;
            return div;
        }

        // Drag & Drop logic
        function drag(ev, name, source) {
            ev.dataTransfer.setData("text/plain", JSON.stringify({ name, source }));
        }

        function allowDrop(ev) {
            ev.preventDefault();
            if (ev.currentTarget.classList) ev.currentTarget.classList.add("drag-over");
        }

        function handleDragLeave(ev) {
            if (ev.currentTarget.classList) ev.currentTarget.classList.remove("drag-over");
        }

        function drop(ev, targetLocation) {
            ev.preventDefault();
            if (ev.currentTarget.classList) ev.currentTarget.classList.remove("drag-over");

            const data = JSON.parse(ev.dataTransfer.getData("text/plain"));
            moveStudentLogic(data.name, data.source, targetLocation);
        }

        function moveStudentLogic(name, source, target) {
            if (source === target) return;

            // Remove from source
            if (source === 'unassigned') {
                unassignedData = unassignedData.filter(s => s !== name);
            } else {
                const sourceRoom = roomsData.find(r => r.id == source);
                if (sourceRoom) sourceRoom.students = sourceRoom.students.filter(s => s !== name);
            }

            // Add to target
            if (target === 'unassigned') {
                unassignedData.push(name);
            } else {
                const targetRoom = roomsData.find(r => r.id == target);
                if (targetRoom) targetRoom.students.push(name);
            }

            renderApp();
        }

        function moveStudentPrompt(name, currentLoc) {
            let options = "Selecciona el número de habitación a donde mover:\n0 = Lista Sin Asignar / Libres\n";
            roomsData.forEach(r => options += `#${r.id} (Cap: ${r.students.length}/${r.cap})\n`);

            const target = prompt(`Mover a ${name}:\n\n` + options);
            if (target === null) return;

            const targetNum = parseInt(target);
            if (targetNum === 0) {
                moveStudentLogic(name, currentLoc, 'unassigned');
            } else if (roomsData.some(r => r.id === targetNum)) {
                moveStudentLogic(name, currentLoc, targetNum);
            } else {
                alert("Habitación no válida.");
            }
        }

        function filterStudents() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            document.querySelectorAll(".student-item").forEach(item => {
                const text = item.textContent.toLowerCase();
                item.style.display = text.includes(query) ? "flex" : "none";
            });
        }

        function resetToInitial() {
            if (confirm("¿Seguro que deseas reiniciar todas las habitaciones a la lista original?")) {
                roomsData = JSON.parse(JSON.stringify(initialDistribution));
                unassignedData = [];
                renderApp();
            }
        }

        function copyReport() {
            let report = "🏨 *REPORTE DE HABITACIONES - VIAJE EVA 2026*\n\n";
            roomsData.forEach(r => {
                report += `📌 *Habitación #${r.id}* (${r.students.length}/${r.cap}):\n`;
                if (r.students.length === 0) report += "   _(Vacía)_\n";
                r.students.forEach(s => report += `   • ${s}\n`);
                report += "\n";
            });

            if (unassignedData.length > 0) {
                report += "⚠️ *Alumnos Sin Asignar / Libres:*\n";
                unassignedData.forEach(s => report += `   • ${s}\n`);
            }

            navigator.clipboard.writeText(report);
            alert("¡Reporte copiado al portapapeles! Puedes pegarlo en WhatsApp.");
        }

        document.addEventListener("DOMContentLoaded", renderApp);
    </script>
</body>
</html>
